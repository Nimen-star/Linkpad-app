name: LinkPad CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  android-build-and-test:
    name: Android APK & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Ensure debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests & build APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: linkpad-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  pc-host-build:
    name: Build Windows PC Host (.NET 4.8 / Inno Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore pc-host/LinkPadHost.sln

      - name: Build PC Host solution
        run: msbuild pc-host/LinkPadHost.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Setup Inno Setup
        uses: ISCC/action-inno-setup@v1
        with:
          filepath: pc-host/installer/LinkPadHost.iss

      - name: Upload Windows Installer & Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: linkpad-windows-host
          path: |
            pc-host/dist/LinkPadHostSetup.exe
            pc-host/bin/Release/net48/LinkPadHost.exe
            pc-host/bin/Release/net48/Nefarius.ViGEm.Client.dll
