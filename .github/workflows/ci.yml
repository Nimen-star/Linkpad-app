name: LinkPad CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  android-build-and-test:
    name: Android APK & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Ensure debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
            fi
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests & build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-linkpad-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  pc-host-build:
    name: Build Windows PC Host (.NET 4.8 / Inno Setup)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore & Build LinkPadHost.exe (.NET 4.8)
        run: msbuild pc-host\LinkPadHost.csproj /t:Restore,Build /p:Configuration=Release /v:minimal

      - name: Build LinkPadHostSetup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc).Source
          }
          & $iscc /DBuildOutputDir="..\bin\Release\net48" pc-host\installer\LinkPadHost.iss

      - name: Stage Windows CI Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pc-host\ci-out | Out-Null
          Copy-Item pc-host\dist\LinkPadHostSetup.exe pc-host\ci-out\LinkPadHostSetup.exe -Force
          Copy-Item pc-host\bin\Release\net48\LinkPadHost.exe pc-host\ci-out\LinkPadHost.exe -Force
          if (Test-Path pc-host\bin\Release\net48\Nefarius.ViGEm.Client.dll) {
            Copy-Item pc-host\bin\Release\net48\Nefarius.ViGEm.Client.dll pc-host\ci-out\Nefarius.ViGEm.Client.dll -Force
          }

      - name: Upload Windows Installer & Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: ci-linkpad-windows-host
          path: pc-host\ci-out\*
