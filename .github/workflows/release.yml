name: Build & Publish LinkPad Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Ensure debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LinkPad-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpad-apk
          path: dist/LinkPad-Android.apk

  build-pc-host:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore pc-host/LinkPadHost.sln

      - name: Build PC Host solution
        run: msbuild pc-host/LinkPadHost.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Setup Inno Setup
        uses: ISCC/action-inno-setup@v1
        with:
          filepath: pc-host/installer/LinkPadHost.iss

      - name: Upload PC Host Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linkpad-pc-host
          path: |
            pc-host/dist/LinkPadHostSetup.exe
            pc-host/bin/Release/net48/LinkPadHost.exe
            pc-host/bin/Release/net48/Nefarius.ViGEm.Client.dll

  publish-release:
    needs: [build-android, build-pc-host]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: linkpad-apk
          path: release-assets

      - name: Download PC Host Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linkpad-pc-host
          path: release-assets

      - name: Determine Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v1.0.0" >> $GITHUB_ENV
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LinkPad Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: |
            release-assets/LinkPad-Android.apk
            release-assets/LinkPadHostSetup.exe
            release-assets/LinkPadHost.exe
            release-assets/Nefarius.ViGEm.Client.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
