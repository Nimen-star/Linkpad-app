name: Build & Publish LinkPad Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore fallback
        shell: bash
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist-android
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist-android/LinkPad-Android.apk
          else
            echo "::warning::KEYSTORE_BASE64, STORE_PASSWORD, or KEY_PASSWORD secret missing - falling back to debug-signed APK."
            gradle :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist-android/LinkPad-Android.apk
          fi
          sha256sum dist-android/LinkPad-Android.apk > dist-android/LinkPad-Android.apk.sha256

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpad-android-apk
          path: |
            dist-android/LinkPad-Android.apk
            dist-android/LinkPad-Android.apk.sha256

  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore & Build LinkPadHost.exe (.NET 4.8)
        run: |
          msbuild pc-host\LinkPadHost.csproj /t:Restore,Build /p:Configuration=Release /v:minimal

      - name: Install Inno Setup & Build Single LinkPadHostSetup.exe
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc).Source
          }
          & $iscc /DBuildOutputDir="..\bin\Release\net48" pc-host\installer\LinkPadHost.iss

      - name: Generate SHA256 checksums for Windows binaries
        shell: pwsh
        run: |
          $setupHash = (Get-FileHash pc-host\dist\LinkPadHostSetup.exe -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash pc-host\bin\Release\net48\LinkPadHost.exe -Algorithm SHA256).Hash.ToLower()
          "$setupHash  LinkPadHostSetup.exe`n$exeHash  LinkPadHost.exe" | Out-File -Encoding ascii pc-host\dist\windows-sha256.txt

      - name: Upload Windows Installer & Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: linkpad-windows-host
          path: |
            pc-host\dist\LinkPadHostSetup.exe
            pc-host\bin\Release\net48\LinkPadHost.exe
            pc-host\bin\Release\net48\Nefarius.ViGEm.Client.dll
            pc-host\dist\windows-sha256.txt

  publish-release:
    needs: [build-android, build-windows-installer]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build Release Notes Summary
        id: notes
        shell: bash
        run: |
          cat <<'EOF' > release-body.md
          ### Included Downloads

          | File | Platform | Description |
          | --- | --- | --- |
          | `LinkPad-Android.apk` | Android 7.0+ | LinkPad Controller & Host mobile app |
          | `LinkPadHostSetup.exe` | Windows 10 / 11 | Full Windows installer wizard (shortcuts + uninstaller) |
          | `LinkPadHost.exe` | Windows 10 / 11 | Standalone portable PC Host executable |

          > **Windows PC Users:** Install [ViGEmBus](https://github.com/nefarius/ViGEmBus/releases) if you want virtual Xbox 360 controllers (`LinkPad P1–P4`), or use Keyboard mode out of the box.

          <details>
          <summary>SHA-256 Checksums</summary>

          ```text
          EOF
          cat release-assets/LinkPad-Android.apk.sha256 >> release-body.md
          cat release-assets/windows-sha256.txt >> release-body.md
          cat <<'EOF' >> release-body.md
          ```

          </details>
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
          name: LinkPad ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
          body_path: release-body.md
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/LinkPadHostSetup.exe
            release-assets/LinkPadHost.exe
            release-assets/LinkPad-Android.apk
