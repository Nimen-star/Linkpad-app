name: Build & Publish LinkPad Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (defaults to versionName in app/build.gradle.kts, e.g. v1.3.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ]; then
            mkdir -p "$ANDROID_HOME/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            fi
          fi

      - name: Ensure debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
            fi
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist-android
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk dist-android/LinkPad-Android.apk
          else
            echo "::notice::KEYSTORE_BASE64, STORE_PASSWORD, or KEY_PASSWORD secret not set - building debug-signed APK."
            gradle :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk dist-android/LinkPad-Android.apk
          fi
          sha256sum dist-android/LinkPad-Android.apk > dist-android/LinkPad-Android.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpad-apk
          path: |
            dist-android/LinkPad-Android.apk
            dist-android/LinkPad-Android.apk.sha256

  build-pc-host:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages (SDK-style)
        run: msbuild pc-host\LinkPadHost.csproj /t:Restore /v:minimal

      - name: Build LinkPadHost.exe (.NET 4.8 Release)
        run: msbuild pc-host\LinkPadHost.csproj /t:Build /p:Configuration=Release /v:minimal

      - name: Build Single-File Installer (LinkPadHostSetup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc).Source
          }
          & $iscc /DBuildOutputDir="..\bin\Release\net48" pc-host\installer\LinkPadHost.iss

      - name: Stage Windows Release Files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pc-host\release-out | Out-Null
          Copy-Item pc-host\dist\LinkPadHostSetup.exe pc-host\release-out\LinkPadHostSetup.exe -Force
          Copy-Item pc-host\bin\Release\net48\LinkPadHost.exe pc-host\release-out\LinkPadHost.exe -Force
          if (Test-Path pc-host\bin\Release\net48\Nefarius.ViGEm.Client.dll) {
            Copy-Item pc-host\bin\Release\net48\Nefarius.ViGEm.Client.dll pc-host\release-out\Nefarius.ViGEm.Client.dll -Force
          }
          $setupHash = (Get-FileHash pc-host\release-out\LinkPadHostSetup.exe -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash pc-host\release-out\LinkPadHost.exe -Algorithm SHA256).Hash.ToLower()
          "$setupHash  LinkPadHostSetup.exe`n$exeHash  LinkPadHost.exe" | Out-File -Encoding ascii pc-host\release-out\windows-sha256.txt

      - name: Upload PC Host Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linkpad-pc-host
          path: pc-host\release-out\*

  publish-release:
    needs: [build-android, build-pc-host]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify Downloaded Release Files
        shell: bash
        run: ls -lh release-assets

      - name: Determine Release Tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            APP_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n1)
            if [ -n "$APP_VER" ]; then
              echo "RELEASE_TAG=v${APP_VER}" >> "$GITHUB_ENV"
            else
              echo "RELEASE_TAG=v1.3.0" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build Release Notes Summary
        shell: bash
        run: |
          cat <<'EOF' > release-body.md
          ### Included Downloads

          | File | Platform | Description |
          | --- | --- | --- |
          | `LinkPad-Android.apk` | Android 7.0+ | LinkPad Controller & 4-Player Host mobile app |
          | `LinkPadHostSetup.exe` | Windows 10 / 11 | Single-file Windows installer wizard (Start Menu shortcut + uninstaller) |
          | `LinkPadHost.exe` | Windows 10 / 11 | Standalone portable PC Host executable |
          | `Nefarius.ViGEm.Client.dll` | Windows 10 / 11 | Optional companion library for portable `LinkPadHost.exe` |

          > **Windows PC Users:** Install [ViGEmBus](https://github.com/nefarius/ViGEmBus/releases) if you want virtual Xbox 360 controllers (`LinkPad P1–P4`), or use Keyboard mode out of the box.

          <details>
          <summary>SHA-256 Checksums</summary>

          ```text
          EOF
          cat release-assets/LinkPad-Android.apk.sha256 >> release-body.md
          cat release-assets/windows-sha256.txt >> release-body.md
          cat <<'EOF' >> release-body.md
          ```

          </details>
          EOF

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: LinkPad ${{ env.RELEASE_TAG }}
          body_path: release-body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/LinkPad-Android.apk
            release-assets/LinkPadHostSetup.exe
            release-assets/LinkPadHost.exe
            release-assets/Nefarius.ViGEm.Client.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
